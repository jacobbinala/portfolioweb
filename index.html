<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Harbor is a personal budget tracker for monthly income, expenses, and savings."
    />
    <meta name="theme-color" content="#f3efe6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#101412" media="(prefers-color-scheme: dark)" />
    <title>Harbor — Personal budget</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      html {
        background: #f3efe6;
      }
      html.dark {
        background: #101412;
      }
    </style>
    <script>
      try {
        var stored = localStorage.getItem('harbor.theme');
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (stored === 'dark' || (stored !== 'light' && prefersDark)) {
          document.documentElement.classList.add('dark');
        }
      } catch (error) {
        /* Storage can be blocked; the app still renders. */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
